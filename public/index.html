<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Power Signup</title>
  <style>
    body {
      background:#0e0e0e;
      color:#00ffcc;
      font-family:monospace;
      padding:40px;
    }
    input, button {
      width:100%;
      padding:10px;
      margin:6px 0;
      background:#111;
      border:1px solid #00ffcc55;
      color:#00ffcc;
    }
    .box {
      max-width:320px;
      margin:auto;
      background:#161616;
      padding:20px;
      border-radius:12px;
    }
  </style>
</head>
<body>

<div class="box" id="app">Loading...</div>

<script>
const app = document.getElementById("app");
const USER_KEY = "userID";

/* ---------- AUTO LOGIN ---------- */
const savedID = localStorage.getItem(USER_KEY);
if (savedID) autoLogin(savedID);
else showAuth();

/* ---------- UI ---------- */
function showAuth() {
  app.innerHTML = `
    <h3>Signup / Login</h3>
    <input id="username" placeholder="Username (signup only)">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  `;
}

/* ---------- SIGNUP ---------- */
async function signup() {
  const res = await fetch("/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: username.value,
      email: email.value,
      password: password.value
    })
  });

  const data = await res.json();
  if (data.userID) {
    localStorage.setItem(USER_KEY, data.userID);
    autoLogin(data.userID);
  } else {
    alert(data.error);
  }
}

/* ---------- LOGIN ---------- */
async function login() {
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  });

  const data = await res.json();
  if (data.userID) {
    localStorage.setItem(USER_KEY, data.userID);
    autoLogin(data.userID);
  } else {
    alert(data.error);
  }
}

/* ---------- AUTO LOGIN ---------- */
async function autoLogin(id) {
  const res = await fetch("/user/" + id);
  const user = await res.json();

  if (!user.username) {
    localStorage.removeItem(USER_KEY);
    showAuth();
    return;
  }

  app.innerHTML = `
    <h2>Welcome ${user.username}</h2>
    <p>${user.email}</p>
    <button onclick="logout()">Logout</button>
  `;
}

function logout() {
  localStorage.removeItem(USER_KEY);
  location.reload();
}
</script>

</body>
</html>
